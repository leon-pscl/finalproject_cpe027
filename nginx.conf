server {
    client_max_body_size 512M;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11;

    location /api/ {
        # Via a variable so the resolver is used per request: a literal upstream name is
        # resolved once at startup, so nginx exits if backend is down and keeps a stale IP
        # across backend restarts -> 502 for the rest of the run.
        set $backend "backend:8000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
