services:
  backend:
    build: &backend-build
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: lectureflow:latest
    container_name: lectureflow_backend
    depends_on:
      model-download:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment: &backend-environment
      WORKER_ENABLED: "true"
      REPOSITORY_BACKEND: memory
      LOCAL_STORAGE_ROOT: /data/storage
      PROCESSING_MODE: real
      ASR_PROVIDER: faster-whisper
      WHISPER_MODEL: base
      WHISPER_THREADS: "4"
      ENHANCE_DEFAULT: "true"
      DSP_ENABLED: "true"
      MAX_UPLOAD_MB: "512"
      LOG_LEVEL: "DEBUG"
      MODEL_CACHE_DIR: /models
      PYTHONPATH: /app
    volumes: &app-volumes
      - ./storage:/data/storage
      - ./models:/models
      - ./hf_cache:/root/.cache/huggingface  # persists Hugging Face embedding weights
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  model-download:
    image: lectureflow:latest
    build: *backend-build
    restart: "no"
    volumes: *app-volumes
    environment:
      <<: *backend-environment
      WORKER_ENABLED: "false"
      LOG_LEVEL: "INFO"
    command: ["python", "-c", "from app.asr import get_model; from app.contracts import Chunk; from app.embedder import Embedder; get_model(); Embedder().embed([Chunk(chunk_id='warm',lecture_id='warm',version='v1',segment_ids=[],start_s=0,end_s=1,text='warm',embedding_model='',embedding_revision='')])"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    image: lectureflow-frontend:latest
    container_name: lectureflow_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

