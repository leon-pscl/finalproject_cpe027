services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lectureflow:latest
    container_name: lectureflow_backend
    ports:
      - "8000:8000"
    environment:
      # Enable the background worker and use in-memory repo for quick dev/testing
      WORKER_ENABLED: "true"
      REPOSITORY_BACKEND: memory
      LOCAL_STORAGE_ROOT: /data/storage
      PROCESSING_MODE: mock   # set to "real" if you installed ffmpeg & want full DSP
      MAX_UPLOAD_MB: "512"
      PYTHONPATH: /app
    volumes:
      - ./storage:/data/storage   # host folder persists uploaded media across restarts
    restart: unless-stopped

# Optional helper for running tests inside a temporary container
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lectureflow:test
    container_name: lectureflow_test
    command: ["pytest", "tests"]
    environment:
      WORKER_ENABLED: "false"
      REPOSITORY_BACKEND: memory
      LOCAL_STORAGE_ROOT: /data/storage
      PYTHONPATH: /app
    volumes:
      - ./storage:/data/storage
    depends_on:
      - backend
    # The test container runs once then exits
    restart: "no"
