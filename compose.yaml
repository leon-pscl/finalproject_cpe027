# This is the compose file


version: "3.3"

services:
  frontend:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      # Pretrained model, downloaded on first use and cached in the volume below.
      # tiny/base = fast, small = recommended CPU default, medium/large-v3 = best accuracy (GPU advised).
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      MODEL_CACHE_DIR: /models
      # DSP enhancement before ASR (see README). Reverb weight 0 = denoise only; test higher values with app.evaluate.
      ENHANCE_AUDIO: ${ENHANCE_AUDIO:-true}
      DSP_REVERB_WEIGHT: ${DSP_REVERB_WEIGHT:-0.0}
    volumes:
      - model-cache:/models
      - ./samples:/samples
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  model-cache:
