name: ci

on:
  pull_request:
  push:
    branches: [iteration_pascual, iteration1-merged, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: |
          ruff check backend
          ruff format --check backend
      - name: Pytest
        run: pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck/build
        working-directory: frontend
        run: npm run build
      - name: Tests
        working-directory: frontend
        run: npm test
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install firebase tools
        run: npm install -g firebase-tools
      - name: Emulator smoke
        run: firebase emulators:exec --only firestore,storage "echo emulator-started" --project demo-lectureflow